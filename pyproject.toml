[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "almanac"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "gridstatus==0.30.1",
  "pandas==2.2.3",
  "numpy==2.2.6",
  "pyarrow==19.0.1",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
# Available after a reinstall; `python -m almanac` works in any checkout.
almanac = "almanac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["network: needs cached or downloadable ERCOT data"]
